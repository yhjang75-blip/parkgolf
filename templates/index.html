<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>전국 파크골프장 지도</title>
  <meta name="description" content="전국 파크골프장의 위치, 홀 수, 필드 상태를 확인하고 공식 예약 페이지로 바로 이동합니다.">
  <meta name="theme-color" content="#1f6b3a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E⛳%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="top">
    <h1>⛳ 전국 파크골프장</h1>
    <p class="sub" id="summary">불러오는 중…</p>
  </header>

  <section class="filters" aria-label="검색 조건">
    <input id="q" type="search" placeholder="구장 이름이나 지역 검색 (예: 강변, 포항)" aria-label="검색어">
    <div class="row">
      <select id="sido" aria-label="시·도"><option value="">전체 시·도</option></select>
      <select id="sigungu" aria-label="시·군·구"><option value="">전체 시·군·구</option></select>
      <select id="holes" aria-label="홀 수">
        <option value="0">홀 수 전체</option>
        <option value="9">9홀 이상</option>
        <option value="18">18홀 이상</option>
        <option value="36">36홀 이상</option>
      </select>
    </div>
    <label class="check"><input type="checkbox" id="online"> 온라인 예약 주소가 있는 곳만</label>
  </section>

  <nav class="tabs" aria-label="보기 전환">
    <button data-view="list" class="on">목록</button>
    <button data-view="map">지도</button>
  </nav>

  <main class="layout" data-view="list">
    <section class="list-pane">
      <p class="count" id="count"></p>
      <ul id="list" class="list"></ul>
      <div id="gap" class="notice"></div>
    </section>
    <section class="map-pane"><div id="map" role="region" aria-label="지도"></div></section>
  </main>

  <aside id="detail" class="detail" hidden aria-live="polite">
    <button class="close" id="close" aria-label="닫기">✕ 닫기</button>
    <div id="detail-body"></div>
  </aside>

  <footer class="foot">
    자료: <a href="https://www.data.go.kr" target="_blank" rel="noopener">공공데이터포털</a> 지자체·시설관리공단 공개 자료 ·
    지도 © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> ·
    날씨 <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a><br>
    예약은 각 운영기관의 공식 사이트에서 이루어집니다. 운영·휴장 여부는 방문 전 운영기관에 꼭 확인하세요.
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
